[project]
name = "python-kl1"
# The version is derived from the newest git tag by uv-dynamic-versioning, so
# `cz bump` (version_provider = "scm") and the built wheel can never disagree.
dynamic = ["version"]
description = "KL1-style concurrent logic programming (Guarded Horn Clauses) for Python, on a tooling-first scaffold: linting, type checking, testing, and security wired up from day one."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/python_kl1"]

[dependency-groups]
dev = [
    "bandit[toml]",
    "commitizen",
    "factory-boy",
    "faker",
    "import-linter",
    "pip-audit",
    "pip-licenses",
    "pre-commit",
    "pyrefly",
    "pyright",
    "pytest>=8",
    "pytest-bdd",
    "pytest-cov",
    "pytest-playwright",
    "pytest-timeout",
    "pytest-xdist",
    "ruff",
]
deploy = [
    "docker",
]

[tool.commitizen]
# Conventional Commits, enforced in two places: the commit-msg pre-commit hook
# on every local commit, and `cz check` over the PR title in CI (a squash merge
# takes the PR title as the commit subject, so that is the one that lands).
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
# The git tag is the single source of truth for the version -- nothing to bump
# in a tracked file, so a release is a tag and not a commit.
version_provider = "scm"
update_changelog_on_bump = false

# pytest configuration lives in `pytest.ini`.

# Architectural layer enforcement (see the README appendix). Higher layers may import
# lower ones, never the reverse. Type-only imports (in `if TYPE_CHECKING:` blocks) are the
# deliberate back-references that keep the *runtime* graph acyclic, so they are excluded.
[tool.importlinter]
root_package = "python_kl1"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "python_kl1.dsl",
    "python_kl1.core.goal | python_kl1.core.stream | python_kl1.core.engine",
    "python_kl1.core.logicvar",
    "python_kl1.core.terms",
]
