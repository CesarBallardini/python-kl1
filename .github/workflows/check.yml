name: check

on:
  push:
    branches: [main]
  pull_request:

# Default-deny: every job below opts back in to exactly the scopes it needs.
permissions: {}

# A PR that gets a second push supersedes the first run rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      - name: Configure pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}

      # pre-commit is the single source of truth for lint and format: running
      # the same hooks here is what stops CI and a local commit disagreeing
      # about which ruff version or which rules applied. no-commit-to-branch is
      # skipped because CI legitimately builds with main checked out.
      - name: Run pre-commit hooks
        run: SKIP=no-commit-to-branch uv run --frozen pre-commit run --all-files

      # The type checkers are not pre-commit hooks -- they need the fully synced
      # project environment to resolve imports, not a hook-managed one -- so
      # they stay separate steps. This mirrors `make types`.
      - name: Type check (pyright)
        run: uv run --frozen pyright

      - name: Type check (pyrefly)
        run: uv run --frozen pyrefly check

      # The layered DAG (dsl -> core.goal | core.stream | core.engine ->
      # core.logicvar -> core.terms). This mirrors `make layers`.
      - name: Architectural layers (import-linter)
        run: uv run --frozen lint-imports
