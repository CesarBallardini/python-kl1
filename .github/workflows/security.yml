name: security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      - name: SAST (bandit)
        run: uv run --frozen bandit -c bandit.yaml -r src

      - name: Dependency audit (pip-audit)
        run: uv run --frozen pip-audit --skip-editable

  # Licenses. The gate deliberately runs over the *runtime* closure only: nothing
  # else is distributed, so nothing else creates a licensing obligation. The
  # library has no runtime dependencies today, so the gate is a no-op until one
  # is added; the dev toolchain is reported but not gated.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      - name: Report the licenses of the whole toolchain
        run: |
          {
            echo "## Dependency licenses"
            echo
            uv run --frozen pip-licenses --format=markdown --with-urls
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate the licenses of the distributed dependencies
        run: |
          set -euo pipefail
          runtime=$(uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements.txt \
            | sed -e 's/[[:space:]]*[;#].*$//' -e 's/[=<>!~].*$//' -e '/^$/d' \
            | paste -sd' ' -)

          if [ -z "$runtime" ]; then
            echo "No runtime dependencies to check; nothing is distributed yet."
            exit 0
          fi

          echo "Checking: $runtime"
          uv run --frozen pip-licenses --packages $runtime \
            --fail-on="GNU General Public License (GPL);GNU General Public License v2 or later (GPLv2+);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 or later (AGPLv3+)"

  # gitleaks is a Go binary, not a PyPI package, so it cannot go through uv.
  # The version is pinned to match the hook rev in .pre-commit-config.yaml so
  # CI and a local commit scan with the same ruleset. The hook only ever sees
  # staged changes, which is a no-op in CI, so this job scans the whole tree.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the working tree for secrets
        run: gitleaks dir . --redact --verbose -c .gitleaks.toml

  # osv-scanner is a standalone Go binary, wired in as Google's official
  # reusable workflow so it scans uv.lock directly and uploads its findings to
  # the code-scanning dashboard as SARIF.
  osv-scanner:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=./uv.lock
